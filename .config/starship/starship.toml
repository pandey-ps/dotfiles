add_newline = true
command_timeout = 200
format = "[$directory$git_branch$git_status]($style)$character"

[character]
success_symbol = "[❯](bold #d4c8b2)"
error_symbol = "[❯](bold #fb4934)"

[directory]
truncation_length = 2
truncation_symbol = "…/"
home_symbol = ""
style = "bold #d4c8b2"
read_only_style = "bold #fb4934"

[git_branch]
format = "[$branch]($style) "
style = "italic #9e9489"

[git_status]
format = '[$all_status]($style)'
style = "#9e9489"
ahead = "⇡${count} "
diverged = "⇕⇡${ahead_count}⇣${behind_count} "
behind = "⇣${count} "
conflicted = "!"
up_to_date = ""
untracked = "?"
modified = "*"
stashed = ""
staged = "+"
renamed = "»"
deleted = "✘"
